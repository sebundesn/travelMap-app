<h2 class="sr-only">Loading animation with a side-view airliner flying along a dashed flight path, for a travel app's loading screen</h2>
<div style="display:flex; flex-direction:column; align-items:center; padding:2.5rem 0;">
  <div style="position:relative; width:100%; max-width:420px; height:110px;">
    <svg viewBox="0 0 420 110" width="100%" height="110" style="display:block;">
      <path id="flightpath" d="M 20 85 Q 140 25 210 60 T 400 35" fill="none" stroke="var(--border-strong)" stroke-width="2" stroke-dasharray="1 10" stroke-linecap="round"/>
      <circle cx="20" cy="85" r="4" fill="var(--text-muted)"/>
      <circle cx="400" cy="35" r="4" fill="var(--text-muted)"/>
    </svg>
    <svg id="plane" width="96" height="40" viewBox="0 0 120 50" style="position:absolute; top:0; left:0; overflow:visible;">
      <path d="M58 21 L44 9 L49 9 L68 21 Z" fill="#5F5E5A"/>
      <path d="M20 22 L12 17 L16 17 L26 22 Z" fill="#5F5E5A"/>
      <path d="M8 21 C8 20 9 19 11 19 L96 18 C106 18 113 21 117 25 C113 29 106 31 96 31 L34 31 C24 31 14 27 8 22 Z" fill="#F1EFE8" stroke="#888780" stroke-width="0.6"/>
      <path d="M14 26 C20 29 27 31 34 31 L96 31 C106 31 113 29 117 25 L116 26 C112 28.5 104 30 96 30 L34 30 C27 30 20 28.5 14 26 Z" fill="#B4B2A9"/>
      <path d="M12 23.5 C18 26 26 27.5 34 27.5 L100 27.5 C106 27.5 110 27 113 26.5" fill="none" stroke="#378ADD" stroke-width="1.6"/>
      <path d="M10 20 L4 3 L13 3 L32 19 Z" fill="#185FA5"/>
      <path d="M7 11 L12 11 L22 19 L17 19 Z" fill="#378ADD"/>
      <line x1="34" y1="22" x2="94" y2="22" stroke="#0C447C" stroke-width="2" stroke-dasharray="1.6 2.4"/>
      <path d="M104 21 L110 21.5 L113 23.5 L106 23.5 Z" fill="#0C447C"/>
      <rect x="98" y="20" width="2.4" height="7" rx="0.6" fill="none" stroke="#888780" stroke-width="0.5"/>
      <path d="M16 25 L6 33 L11 33 L26 26 Z" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
      <path d="M58 27 L42 43 L49 43 L72 28 Z" fill="#D3D1C7" stroke="#888780" stroke-width="0.6"/>
      <path d="M42 43 L49 43 L50 41.5 L44 41.5 Z" fill="#378ADD"/>
      <rect x="54" y="30" width="16" height="6" rx="3" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.5"/>
      <ellipse cx="69.5" cy="33" rx="1.4" ry="3" fill="#444441"/>
      <rect x="55" y="30.8" width="12" height="1.4" rx="0.7" fill="#F1EFE8"/>
    </svg>
  </div>
</div>
<script>
(function(){
  var plane = document.getElementById('plane');
  var path = document.getElementById('flightpath');
  var len = path.getTotalLength();
  var dur = 3200;
  var start = null;
  function frame(ts){
    if(!start) start = ts;
    var t = ((ts - start) % dur) / dur;
    var pt = path.getPointAtLength(t * len);
    var pt2 = path.getPointAtLength(Math.min(t * len + 1, len));
    var angle = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 180 / Math.PI;
    plane.style.transformOrigin = '48px 20px';
    plane.style.transform = 'translate(' + (pt.x - 48) + 'px,' + (pt.y - 20) + 'px) rotate(' + angle + 'deg)';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
