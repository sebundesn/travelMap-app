# Used on the App EC2 instance only. Unlike the root docker-compose.yml
# (local dev: builds images, runs its own Postgres container), this pulls
# pre-built images from ECR and points at RDS — nothing is built on the
# instance itself (a t3.micro struggles to build the Next.js image).
services:
  backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: /app/uploads
      PORT: 8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
