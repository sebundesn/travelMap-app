name: CI

# Runs on every PR and every push, no AWS credentials needed. Nothing here
# touches the cloud — this is the "does the code work" gate.
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: test -z "$(gofmt -l .)"
        working-directory: backend

      - name: go vet
        run: go vet ./...
        working-directory: backend

      - name: go build
        run: go build ./...
        working-directory: backend

      - name: go test
        run: go test ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      # NEXT_PUBLIC_* values are baked in at build time; dummy values here are
      # fine since this build's only job is to prove the app compiles. The
      # real values are supplied by deploy.yml when it builds the image that
      # actually ships.
      - name: next build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: dummy

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Proves the Dockerfile itself still builds; doesn't push anywhere.
      - name: build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=dummy
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=dummy
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
