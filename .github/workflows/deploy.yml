name: Deploy

# Builds images, pushes them to ECR, then tells the App EC2 instance (in a
# private subnet, no inbound ports open to it at all) to pull and restart —
# entirely over SSM, no SSH key anywhere in this pipeline.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC — this job gets a short-lived AWS token, no static keys stored in GitHub
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECR_BACKEND_REPO: travelmap-backend
  ECR_FRONTEND_REPO: travelmap-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA:0:12}"
          echo "backend_image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:$SHA_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to App EC2 via SSM
        run: |
          set -euo pipefail
          CMD="cd /home/ec2-user/travelMap-app && git pull --ff-only && bash infra/deploy.sh '${{ steps.meta.outputs.backend_image }}' '${{ steps.meta.outputs.frontend_image }}' '${{ env.AWS_REGION }}'"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "travelMap deploy $GITHUB_SHA" \
            --parameters "{\"commands\":[$(jq -Rs . <<< "$CMD")]}" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "--- remote stderr ---"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            echo "::error::deploy failed with status $STATUS"
            exit 1
          fi
          echo "deploy succeeded ($STATUS)"
